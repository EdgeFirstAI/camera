[package]
name = "edgefirst-camera"
description = "EdgeFirst Camera SDK: portable camera capture into edgefirst-tensor zero-copy buffers"
repository = "https://github.com/EdgeFirstAI/camera"
license = "Apache-2.0"
version = "3.0.0-dev"
edition = "2021"
rust-version = "1.94"
readme = "README.md"
keywords = ["camera", "v4l2", "libcamera", "zero-copy", "edge"]
categories = ["multimedia::video", "hardware-support"]
include = ["src/**", "tests/**", "benches/**", "README.md", "ARCHITECTURE.md", "TESTING.md"]

[features]
default = ["static", "v4l2"]
# Forwarding alias to edgefirst-tensor; never a pin.
static = ["edgefirst-tensor/static"]
# Synthetic frame source for tests, CI and as the worked example for backends.
mock = []
# V4L2 capture backend (Linux).
v4l2 = ["dep:edgefirst-v4l2"]
# `Frame` → `edgefirst_msgs/CameraFrame` mapping.
schemas = ["dep:edgefirst-schemas"]

[dependencies]
# HAL main until a release carries the contiguity request and query
# (EDGEAI-2017); switch back to a crates.io version before releasing.
edgefirst-tensor = { git = "https://github.com/EdgeFirstAI/hal", rev = "03e58128", default-features = false }
edgefirst-schemas = { version = "4.0.0", optional = true }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
edgefirst-v4l2 = { version = "0.2.1", optional = true }

[dev-dependencies]
criterion = "0.8.2"
uhlc = "0.8.2"

[[test]]
name = "mock"
required-features = ["mock"]

[[test]]
name = "schema"
required-features = ["mock", "schemas"]

[[bench]]
name = "capture"
harness = false

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"

[package.metadata.docs.rs]
features = ["mock", "schemas"]
