# The shared Full workflow's x86_64 coverage lane runs `--profile ci` whenever
# this file exists, so the profile must be defined even though it is empty.
[profile.ci]

# Show output from these tests even when they pass, so the `::warning`
# annotation they print on CMA exhaustion reaches the GitHub Actions log.
[[profile.default.overrides]]
filter = "binary(test_image) & (test(=test_8k) | test(=test_16k))"
success-output = "final"
