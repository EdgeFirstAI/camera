# Full scancode SBOM for releases (Quick tier covers dependency SBOM on PRs).
#
# Action Versions (hash-pinned):
# - actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 (v7.0.1)
# - actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 (v6.2.0)
# - actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a (v7.0.1)
# - dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 (stable)

name: SBOM

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
  workflow_call:

jobs:
  generate-sbom:
    name: Generate SBOM & Check License Compliance
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7  # stable

      - name: Install cargo tools
        run: |
          cargo install cargo-cyclonedx --version 0.5.7 --locked
          cargo install cargo-license --version 0.7.0 --locked

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install scancode-toolkit
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install scancode-toolkit cyclonedx-bom

      - name: Install CycloneDX CLI
        run: |
          mkdir -p ~/.local/bin
          wget -q -O ~/.local/bin/cyclonedx \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.27.1/cyclonedx-linux-x64
          chmod +x ~/.local/bin/cyclonedx
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate complete SBOM
        run: bash .github/scripts/generate_sbom.sh

      - name: Validate SBOM format
        run: cyclonedx validate --input-file sbom.json

      - name: Check license policy
        run: python3 .github/scripts/check_license_policy.py sbom.json

      - name: Validate NOTICE file
        run: python3 .github/scripts/validate_notice.py NOTICE sbom.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

      - name: Fail on license violations
        if: failure()
        run: |
          echo "SBOM generation or license policy check failed."
          exit 1
