# SonarCloud upload for Full and nightly runs.
#
# Action Versions (hash-pinned):
# - actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 (v7.0.1)
# - actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c (v8.0.1)
# - SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f (v8.2.1)

name: SonarCloud

on:
  workflow_call:

jobs:
  sonar:
    name: SonarCloud
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          pattern: coverage-*
          path: coverage/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        continue-on-error: true
        with:
          pattern: clippy-report-*
          path: clippy/

      - name: Organize coverage and clippy reports
        run: |
          set -euo pipefail
          echo "=== Downloaded coverage artifacts ==="
          find coverage/ -type f 2>/dev/null || true
          RUST_REPORTS=$(find coverage/ -name "*.lcov" 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          CLIPPY_REPORTS=$(find clippy/ -name "clippy-report.json" 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          echo "RUST_COVERAGE_PATHS=${RUST_REPORTS:-}" >> "$GITHUB_ENV"
          echo "CLIPPY_PATHS=${CLIPPY_REPORTS:-}" >> "$GITHUB_ENV"

      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4  # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            -Dsonar.rust.lcov.reportPaths=${{ env.RUST_COVERAGE_PATHS }}
            -Dsonar.rust.clippy.reportPaths=${{ env.CLIPPY_PATHS }}
