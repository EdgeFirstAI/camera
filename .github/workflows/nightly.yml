# Nightly Full tier + advisories + Sonar main baseline.
# Shared workflows: EdgeFirstAI/.github@8b104b2fd96f4712d2d63184880aa19d88d11354 (EdgeFirstAI/.github#53, pending merge)

name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even if main has not moved since the last nightly.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  changed:
    uses: EdgeFirstAI/.github/.github/workflows/nightly-gate.yml@8b104b2fd96f4712d2d63184880aa19d88d11354
    with:
      force: ${{ inputs.force || false }}

  advisories:
    uses: EdgeFirstAI/.github/.github/workflows/advisories.yml@8b104b2fd96f4712d2d63184880aa19d88d11354

  nightly:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: EdgeFirstAI/.github/.github/workflows/rust-full.yml@8b104b2fd96f4712d2d63184880aa19d88d11354
    with:
      lanes: all
      nightly: true
      # Any board with a working V4L2 capture path; libcamera-only boards
      # cannot run the camera.
      boards: camera-v4l2
      sonar: false
      scancode: true
      skip-macos: true
      skip-windows: true
      timeout-minutes: 45
      board-timeout-minutes: 45
      runner-class-linux: hosted
      runner-class-linux-arm: hosted
      pre-command: bash .github/scripts/ci-setup.sh
      board-pre-command: bash .github/scripts/ci-board-setup.sh
      board-extra-args: -j 1 --no-fail-fast -- --include-ignored
      nextest-args: --workspace --locked --bin edgefirst-camera --test env_scrub --test on_target
      archive-args: --locked --bin edgefirst-camera --test test_image --test on_target
    secrets: inherit

  sonar:
    needs: [changed, nightly]
    if: needs.changed.outputs.run == 'true' && needs.nightly.result == 'success'
    uses: ./.github/workflows/sonar.yml
    secrets: inherit
