# Nightly Full tier + advisories + Sonar main baseline.
# Shared workflows: EdgeFirstAI/.github@b65fec89d297d73f193892996373659c4eaeb93a (main after 2.0.0, includes #53)

name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even if main has not moved since the last nightly.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  changed:
    uses: EdgeFirstAI/.github/.github/workflows/nightly-gate.yml@9e296f92996b38683c684b9091ed59cb27562770
    with:
      force: ${{ inputs.force || false }}

  advisories:
    uses: EdgeFirstAI/.github/.github/workflows/advisories.yml@9e296f92996b38683c684b9091ed59cb27562770

  nightly:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: EdgeFirstAI/.github/.github/workflows/rust-full.yml@9e296f92996b38683c684b9091ed59cb27562770
    with:
      lanes: all
      nightly: true
      # Any board with a working V4L2 capture path; libcamera-only boards
      # cannot run the camera.
      boards: camera-v4l2
      sonar: false
      scancode: true
      # macOS and Windows lanes live in camera-full.yml (nightly-camera).
      skip-macos: true
      skip-windows: true
      timeout-minutes: 45
      board-timeout-minutes: 45
      runner-class-linux: hosted
      runner-class-linux-arm: hosted
      pre-command: bash .github/scripts/ci-setup.sh
      # The boards need no setup; unset, the board lane runs pre-command.
      board-pre-command: "true"
      board-extra-args: -j 1 --no-fail-fast -- --include-ignored
      nextest-args: --workspace --locked --features edgefirst-camera/mock,edgefirst-camera/schemas,edgefirst-camera/file --lib --bin edgefirst-camera --test env_scrub --test on_target --test board --test publish --test subcommands --test mock --test schema --test file --test v4l2_vivid --test layout
      archive-args: --locked --bin edgefirst-camera --test on_target --test board
    secrets: inherit

  nightly-camera:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/camera-full.yml

  sonar:
    needs: [changed, nightly]
    if: needs.changed.outputs.run == 'true' && needs.nightly.result == 'success'
    uses: ./.github/workflows/sonar.yml
    secrets: inherit
