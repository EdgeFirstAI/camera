# Nightly Full tier + advisories + Sonar main baseline.
# Shared workflows: EdgeFirstAI/.github@b65fec89d297d73f193892996373659c4eaeb93a (main after 2.0.0, includes #53)

name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even if main has not moved since the last nightly.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  changed:
    uses: EdgeFirstAI/.github/.github/workflows/nightly-gate.yml@c7876194b9fe9f7f72daf0efadaf32d7dff1b257
    with:
      force: ${{ inputs.force || false }}

  advisories:
    uses: EdgeFirstAI/.github/.github/workflows/advisories.yml@c7876194b9fe9f7f72daf0efadaf32d7dff1b257

  # The prebuilt libcamera shims the i.MX 95 board lane loads.
  libcamera-shim:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/libcamera-shim.yml

  nightly:
    needs: [changed, libcamera-shim]
    if: needs.changed.outputs.run == 'true'
    uses: EdgeFirstAI/.github/.github/workflows/rust-full.yml@c7876194b9fe9f7f72daf0efadaf32d7dff1b257
    with:
      lanes: all
      nightly: true
      # As in ci.yml: an i.MX 8M Plus and the IQ-9075 EVK's USB webcam
      # through V4L2, and the i.MX 95 and Raspberry Pi 5 through libcamera;
      # board-setup.sh points the tests at each board's camera.
      boards: camera-v4l2+imx8mp, camera-v4l2+iq9075, camera-libcamera+imx95, camera-libcamera+rpi5
      # The ten-minute platform soak (tests/board.rs).
      env: |
        EDGEFIRST_SOAK_SECS=600
      sonar: false
      scancode: true
      # macOS and Windows lanes live in camera-full.yml (nightly-camera).
      skip-macos: true
      skip-windows: true
      timeout-minutes: 45
      board-timeout-minutes: 45
      runner-class-linux: hosted
      runner-class-linux-arm: hosted
      # vivid is required unless the repository variable
      # CAMERA_ALLOW_NO_VIVID is true (see vivid-setup.sh).
      pre-command: ${{ vars.CAMERA_ALLOW_NO_VIVID == 'true' && 'EDGEFIRST_CAMERA_ALLOW_NO_VIVID=1 ' || '' }}bash .github/scripts/ci-setup.sh
      # Unset, the board lane would run pre-command.
      board-pre-command: bash .github/scripts/board-setup.sh
      board-extra-args: -j 1 --no-fail-fast -- --include-ignored
      nextest-args: --workspace --locked --features edgefirst-camera/mock,edgefirst-camera/schemas,edgefirst-camera/file --lib --bin edgefirst-camera --test env_scrub --test on_target --test board --test publish --test subcommands --test mock --test schema --test file --test v4l2_vivid --test layout
      # The SDK's file-source tests play the recording board-setup.sh names.
      archive-args: --workspace --locked --features edgefirst-camera/file --bin edgefirst-camera --test on_target --test board --test file
    secrets: inherit

  nightly-camera:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    uses: ./.github/workflows/camera-full.yml

  sonar:
    needs: [changed, nightly]
    if: needs.changed.outputs.run == 'true' && needs.nightly.result == 'success'
    uses: ./.github/workflows/sonar.yml
    secrets: inherit
