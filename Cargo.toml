[package]
name = "edgefirst-camera-app"
description = "EdgeFirst Camera Publisher"
repository = "https://github.com/EdgeFirstAI/camera"
license = "Apache-2.0"
version = "3.0.0-dev"
edition = "2021"
rust-version = "1.94"
default-run = "edgefirst-camera"

[[bin]]
name = "edgefirst-camera"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/edgefirst-camera-linux-{ target-arch }"
pkg-fmt = "bin"

[profile.release]
opt-level = 3
lto = true
strip = true
debug = false

[profile.profiling]
inherits = "release"
strip = false
debug = true

[workspace]
members = ["crates/camera"]
resolver = "2"

[[test]]
name = "env_scrub"
harness = false

[features]
default = ["tracy"]
tracy = ["tracing-tracy/enable", "tracy-client/enable"]
profiling = [
    "tracing-tracy/sampling",
    "tracing-tracy/system-tracing",
    "tracy-client/sampling",
    "tracy-client/system-tracing",
]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
console-subscriber = "0.5.0"
edgefirst-camera = { version = "3.0.0-dev", path = "crates/camera", features = ["mock", "file", "schemas"] }
edgefirst-codec = { version = "0.36.0", default-features = false, features = ["v4l2"] }
edgefirst-image = { version = "0.36.0", default-features = false, features = ["opengl"] }
edgefirst-schemas = "4.0.0"
edgefirst-tensor = { version = "0.36.0", default-features = false }
kanal = { git = "https://github.com/fereidani/kanal", rev = "b6aeab2" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "time",
    "io-std",
    "tracing",
    "signal",
] }
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.23"
tracing-tracy = { version = "0.12.0", default-features = false, features = [
    "manual-lifetime",
    "broadcast",
    "ondemand",
    "fibers",
] }
tracy-client = { version = "0.19.0", default-features = false, features = [
    "manual-lifetime",
    "broadcast",
    "ondemand",
    "fibers",
] }
turbojpeg = { version = "1.5.1", features = ["image", "require-simd"] }
zenoh = "1.10.1"
gethostname = "1.1.0"

[dev-dependencies]
libc = "0.2.189"
serial_test = "4.0.1"
