[package]
name = "edgefirst-camera"
description = "EdgeFirst Camera Publisher"
repository = "https://github.com/EdgeFirstAI/camera"
license = "Apache-2.0"
version = "2.8.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
strip = true
debug = false

[profile.profiling]
inherits = "release"
strip = false
debug = true

[workspace]

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "convert"
harness = false

[features]
default = ["tracy"]
tracy = ["tracing-tracy/enable", "tracy-client/enable"]
profiling = [
    "tracing-tracy/sampling",
    "tracing-tracy/system-tracing",
    "tracy-client/sampling",
    "tracy-client/system-tracing",
]

[dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
console-subscriber = "0.5.0"
dma-buf = "0.4.0"
dma-heap = "0.4.1"
edgefirst-schemas = "4.0.0"
g2d-sys = "1.3.1"
kanal = { git = "https://github.com/fereidani/kanal", rev = "b6aeab2" }
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "time",
    "io-std",
    "tracing",
    "signal",
] }
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.23"
tracing-tracy = { version = "0.12.0", default-features = false, features = [
    "manual-lifetime",
    "broadcast",
    "ondemand",
    "fibers",
] }
tracy-client = { version = "0.19.0", default-features = false, features = [
    "manual-lifetime",
    "broadcast",
    "ondemand",
    "fibers",
] }
turbojpeg = { version = "1.5.1", features = ["image", "require-simd"] }
unix-ts = "1.0.0"
videostream = "2.5.3"
zenoh = "1.10.0"

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }
serial_test = "3.5.0"
